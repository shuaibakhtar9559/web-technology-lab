<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Event Image Gallery</title>


<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    line-height: 1.65;
    color: #243247;
    background: #f3f6fb;
}
header {
    background: linear-gradient(135deg, #17365d, #2563a6);
    color: #fff;
    text-align: center;
    padding: 30px 20px;
}
header h1, header h2 { margin: 4px 0; }
nav {
    background: #102744;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px;
}
nav a {
    color: #fff;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 5px;
}
nav a:hover { background: #2d5d91; }
main {
    width: min(1000px, calc(100% - 32px));
    margin: 28px auto;
}
section, article, aside, form {
    background: #fff;
    padding: 22px;
    margin: 18px 0;
    border: 1px solid #e1e8f0;
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(22, 48, 79, .06);
}
h2, h3 { color: #1d4776; }
a { color: #2163a5; }
a:hover { color: #12375e; }
img { max-width: 100%; height: auto; border-radius: 8px; }
figure { margin: 16px 0; }
figcaption { color: #5b6878; font-size: .94rem; margin-top: 8px; }
table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    margin: 18px 0;
}
th { background: #1d4776; color: #fff; }
th, td { border: 1px solid #d6e0ec; padding: 11px; text-align: left; }
tr:nth-child(even) td { background: #f1f6fc; }
input, select, textarea {
    max-width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #bdc9d8;
    border-radius: 5px;
    font: inherit;
}
input[type="radio"], input[type="checkbox"] { accent-color: #2563a6; }
input[type="submit"], input[type="reset"], button {
    background: #1d4776; color: white; border: 0; cursor: pointer;
    padding: 10px 18px; border-radius: 5px; margin: 5px 6px 5px 0;
}
input[type="submit"]:hover, input[type="reset"]:hover, button:hover { background: #2d5d91; }
hr { border: 0; border-top: 1px solid #dbe3ed; }
footer {
    background: #102744; color: #fff; text-align: center;
    padding: 18px; margin-top: 32px;
}
@media (max-width: 650px) {
    header { padding: 24px 14px; }
    main { width: calc(100% - 20px); }
    section, article, aside, form { padding: 16px; }
    table { font-size: .88rem; }
    th, td { padding: 7px; }
}
</style>

</head>

<body>

    <header>

        <h1>College Event Gallery</h1>

        <p>
            A collection of photographs from our annual college events.
        </p>

    </header>

    <hr>

    <main>

        <section>

            <h2>Annual Cultural Festival</h2>

            <figure>

                <img
                    src="https://picsum.photos/id/1011/500/300"
                    alt="Students participating in a college cultural festival"
                    width="500"
                    height="300">

                <figcaption>
                    Students participating in the cultural festival.
                </figcaption>

            </figure>

        </section>


        <section>

            <h2>Sports Day</h2>

            <figure>

                <img
                    src="https://picsum.photos/id/1058/500/300"
                    alt="Students participating in an outdoor sports event"
                    width="500"
                    height="300">

                <figcaption>
                    Students participating in the annual sports day.
                </figcaption>

            </figure>

        </section>


        <section>

            <h2>College Campus</h2>

            <figure>

                <img
                    src="https://picsum.photos/id/1043/500/300"
                    alt="View of the college campus surrounded by trees"
                    width="500"
                    height="300">

                <figcaption>
                    A view of the college campus.
                </figcaption>

            </figure>

        </section>


        <section>

            <h2>Prize Distribution</h2>

            <figure>

                <img
                    src="https://picsum.photos/id/1060/500/300"
                    alt="Students receiving prizes during a college ceremony"
                    width="500"
                    height="300">

                <figcaption>
                    Prize distribution ceremony.
                </figcaption>

            </figure>

        </section>

    </main>

    <hr>

    <footer>

        <p>
            &copy; 2026 ABC University
        </p>

    </footer>

</body>
</html>
